[tool.poetry]
name = "pywarehouse"
version = "0.1.0"
description = "Open-source warehouse management system built on PostgreSQL"
authors = []
readme = "README.md"
packages = [{ include = "src" }]

[tool.poetry.dependencies]
python = "^3.11"
psycopg2-binary = "^2.9"
sqlalchemy = "^2.0"
alembic = "^1.13"
pydantic = "^2.0"
pydantic-settings = "^2.0"
fastapi = "^0.111"
uvicorn = { extras = ["standard"], version = "^0.29" }
python-dotenv = "^1.0"
[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)"
]
